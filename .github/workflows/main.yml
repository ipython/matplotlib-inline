name: Tests

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash -l {0}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
        include:
          #- os: macos-latest
          #  python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with test dependencies
      # matplotlib is not a dependency but tests need it
      run: |
        pip install .[test]
        pip install matplotlib

    - name: Test installation without nbdime
      run: pytest -v

    - name: Test flake8
      if: ${{ matrix.python-version == '3.14' }}
      run: flake8 matplotlib_inline --ignore=E501,W504,W503

    - name: Test Build
      if: ${{ matrix.python-version == '3.14' }}
      run: |
        pip install build
        python -m build

    - name: Install ruff
      if: ${{ matrix.python-version == '3.14' }}
      run: pip install ruff

    - name: Check code with ruff
      if: ${{ matrix.python-version == '3.14' }}
      run: ruff check matplotlib_inline

    - name: Check formatting with ruff
      if: ${{ matrix.python-version == '3.14' }}
      run: ruff format matplotlib_inline --check

    - name: install Mypy
      if: ${{ matrix.python-version == '3.14' }}
      run : pip install mypy matplotlib

    - name: run mypy
      if: ${{ matrix.python-version == '3.14' }}
      run: mypy .
