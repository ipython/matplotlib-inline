name: "Publish Wheel"
on:
  push:
    tags:
      - '*'
permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/matplotlib-inline
    permissions:
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build matplotlib IPython
    - name: Build package
      run: python -m build
    - name: Install built wheel
      run: pip install dist/*.whl
    - name: Echo current tag
      run: echo "$GITHUB_REF"
    - name: Get package version
      run: |
        export PACKAGE_VERSION=$(python -c 'import matplotlib_inline; print(matplotlib_inline.__version__)')
        echo "Package version: $PACKAGE_VERSION"
        if [ "$GITHUB_REF" != "refs/tags/$PACKAGE_VERSION" ]; then
          echo "Tag and package version do not match. Aborting. $GITHUB_REF vs refs/tags/$PACKAGE_VERSION"
          exit 1
        fi
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247

